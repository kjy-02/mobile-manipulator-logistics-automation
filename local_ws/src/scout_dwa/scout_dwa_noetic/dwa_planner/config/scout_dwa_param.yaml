# Scout/VLP-16 starting profile derived from the previously used direct-goal node.
# Start at 0.30 m/s. Raise TARGET_VELOCITY only after low-speed field tests.
TARGET_VELOCITY: 0.30 # [m/s], previous candidates covered 0.30 .. 0.50

# Trajectory simulation
PREDICT_TIME: 2.0      # [s]
SIM_TIME_SAMPLES: 20
SIM_PERIOD: 0.05       # [s], 20 Hz control loop
SIM_DIRECTION: 1.57    # [rad]
SLOW_VELOCITY_TH: 0.10 # [m/s]
VELOCITY_SAMPLES: 5
YAWRATE_SAMPLES: 30

# Cost
OBSTACLE_COST_GAIN: 1.0
TO_GOAL_COST_GAIN: 0.8
SPEED_COST_GAIN: 0.4
PATH_COST_GAIN: 0.0
ANGLE_RESOLUTION: 0.087 # [rad], about 5 degrees
OBS_RANGE: 3.0          # [m]

# Position-only goal behavior matching the previous node
GOAL_THRESHOLD: 0.50           # [m]
TURN_DIRECTION_THRESHOLD: 3.20 # [rad], do not require final goal yaw
ANGLE_TO_GOAL_TH: 3.141592653589793 # keep direct-goal DWA behavior

# Filters are evaluated in the incoming VLP-16 point-cloud frame before
# points are transformed to ROBOT_FRAME. These values come from the previous
# working node and must be checked in RViz on the real vehicle.
POINTCLOUD_MIN_X: -0.45 # [m]
POINTCLOUD_MIN_Z: -0.55 # [m]
POINTCLOUD_MAX_Z: 0.50  # [m]
